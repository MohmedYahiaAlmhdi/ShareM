name: Flutter CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  analyze-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects and LAN permissions
        run: python3 tool/bootstrap.py
      - run: flutter pub get
      - name: Generate ShareM launcher icons
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Android APK (debug build)
        run: flutter build apk --debug
      - name: Compile optimized release variants (unsigned smoke test)
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols
      - name: Report optimized APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*release.apk
      - name: Preserve unsigned split APKs for offline signing verification
        uses: actions/upload-artifact@v4
        with:
          name: ShareM-unsigned-release-ABIs
          path: build/app/outputs/flutter-apk/*release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Android apksigner for offline signature verification
        shell: bash
        run: |
          cp "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -n 1)" ./apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-cli
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ShareM-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
