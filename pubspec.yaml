name: sharem
description: ShareM - local peer-to-peer file sharing.
publish_to: none
version: 0.6.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.2
  crypto: ^3.0.6
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sharem.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/sharem.png
  adaptive_icon_background: "#0879D9"
  adaptive_icon_foreground: assets/branding/sharem.png
  adaptive_icon_foreground_inset: 18
